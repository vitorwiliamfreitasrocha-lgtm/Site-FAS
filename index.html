<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; connect-src 'self' https://haz.tail5f7589.ts.net; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Flying Apollo Studios</title>
<meta name="description" content="Flying Apollo Studios: estúdio independente de jogos para celular e PC. Independent mobile and PC game studio.">
<meta property="og:title" content="Flying Apollo Studios">
<meta property="og:description" content="Estúdio independente de jogos para celular e PC.">
<meta property="og:image" content="https://www.fastudios.com.br/assets/img/logo-apollo.png">
<meta name="theme-color" content="#04050A">
<link rel="icon" href="/assets/img/games/rare-minerals-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/site.css?v=20261018b">
<script src="/assets/js/config.js?v=20261018b" defer></script>
<script src="/assets/js/conteudo.js?v=20261018b" defer></script>
<script src="/assets/js/comum.js?v=20261018b" defer></script>
<script src="/assets/js/home.js?v=20261018b" defer></script>
</head>
<body>
<section class="hero" id="hero" aria-label="Flying Apollo Studios">
  <div id="heroCamadas"></div>
  <canvas class="hero-estrelas" id="estrelas" aria-hidden="true"></canvas>
  <div class="hero-sombra"></div>
  <div class="hero-brilho" id="brilho"></div>
  <header class="topo" id="topo"></header>
  <div class="hero-conteudo">
    <div class="hero-info">
      <div class="kicker hero-kicker"><span id="heroNum"></span><span class="traco"></span><span id="heroGenero"></span></div>
      <h1 class="hero-titulo" id="heroTitulo" aria-live="polite"></h1>
      <p class="hero-tagline" id="heroTagline"></p>
      <div class="hero-acoes">
        <button type="button" class="btn btn-branco" id="heroVer"><span data-t="seeGame"></span> <span class="mono">→</span></button>
        <span class="pill-preco"><span class="ponto"></span><span id="heroPreco"></span></span>
        <span class="mono hero-plats" id="heroPlats"></span>
      </div>
    </div>
    <div class="fila" id="jogos">
      <div class="fila-topo"><span data-t="ourGames"></span><span id="dica"></span></div>
      <div class="fila-tiles" id="tiles" role="listbox" aria-label="Jogos"></div>
    </div>
  </div>
</section>

<main>
  <section class="secao" id="bastidores" hidden>
    <div class="secao-cab" data-reveal>
      <div><span class="kicker">01 · <span data-t="bKicker"></span></span><h2 class="h2" data-t="bTitle"></h2></div>
      <p data-t="bText"></p>
    </div>
    <div class="grade-2">
      <div data-reveal id="devlog">
        <div class="capa capa-vazia" id="devlogCapa"></div>
        <div class="devlog-rodape">
          <span><span class="rotulo" id="devlogRotulo"></span><b id="devlogTitulo"></b></span>
          <button type="button" class="btn-assistir" id="devlogPlay"><span class="tri"></span><span data-t="watch"></span></button>
        </div>
      </div>
      <div class="wip" data-reveal id="wip"></div>
    </div>
  </section>

  <section class="secao" id="trailers" hidden>
    <div data-reveal style="display:flex;flex-direction:column;gap:16px">
      <span class="kicker"><span id="trNum">02</span> · <span data-t="trKicker"></span></span>
      <h2 class="h2" data-t="trTitle"></h2>
    </div>
    <div class="trailers" id="trailerLista"></div>
  </section>

  <section class="secao" id="sobre">
    <div class="sobre" data-reveal>
      <div class="sobre-arte"><div class="glow"></div><div class="recorte"><img src="/assets/img/logo-apollo.png" alt="Apollo, o pomerânia mascote do estúdio"></div></div>
      <div class="sobre-texto">
        <span class="kicker"><span id="abNum">03</span> · <span data-t="abKicker"></span></span>
        <h2 class="h2" data-t="abTitle"></h2>
        <p data-t="abText"></p>
        <div class="fatos" id="fatos"></div>
      </div>
    </div>
  </section>

  <section class="secao secao-ultima" id="newsletter">
    <div class="news" data-reveal>
      <div>
        <span class="kicker"><span id="nlNum">04</span> · Newsletter</span>
        <h2 class="h2" data-t="nlTitle"></h2>
        <p data-t="nlText"></p>
      </div>
      <form id="nlForm" novalidate>
        <div class="news-campo">
          <label class="so-leitor" for="nlEmail">E-mail</label>
          <input type="email" id="nlEmail" autocomplete="email" maxlength="254" placeholder="voce@email.com" required>
          <button type="submit" class="btn btn-branco" id="nlBtn" data-t="nlBtn"></button>
        </div>
        <span class="news-nota" id="nlNota" data-t="nlNote" role="status"></span>
      </form>
    </div>
  </section>
</main>

<footer id="rodape"></footer>

<div class="overlay video-overlay" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="videoTitulo">
  <div class="video-caixa">
    <div><span id="videoTitulo" style="font-size:16px;font-weight:500"></span><button type="button" class="btn-esc" data-fechar-video>ESC · <span data-t="close"></span></button></div>
    <div class="video-tela" id="videoTela"></div>
  </div>
</div>

<div class="overlay" id="detalheModal" role="dialog" aria-modal="true" aria-labelledby="detNome">
  <div class="detalhe" id="detalhe"></div>
</div>
<noscript><p style="padding:20px;text-align:center">Flying Apollo Studios · <a href="/privacidade/">Privacidade</a> · <a href="/termos/">Termos</a> · flyingapollostudios@gmail.com</p></noscript>
</body>
</html>
